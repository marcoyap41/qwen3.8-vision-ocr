[project]
name = "ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marco Yap", email = "marcochristian@mail.ugm.ac.id" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ocr = "ocr:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
