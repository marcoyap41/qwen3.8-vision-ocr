<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Organization Diagram</title>
    <style>
        :root {
            /* Palette */
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            /* Section Colors */
            --sec-lifecycle-border: #10b981;
            --sec-lifecycle-bg: #ecfdf5;
            --sec-lifecycle-text: #065f46;
            
            --sec-stack-border: #6366f1;
            --sec-stack-bg: #e0e7ff;
            --sec-stack-text: #3730a3;
            
            --sec-concerns-border: #f97316;
            --sec-concerns-bg: #ffedd5;
            --sec-concerns-text: #9a3412;
            
            --sec-org-border: #64748b;
            --sec-org-bg: #f1f5f9;
            --sec-org-text: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .diagram-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Common Section Styles */
        .section {
            border: 1px dashed var(--text-muted);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 1.5rem 0;
            color: var(--text-main);
        }

        /* 1. Lifecycle Section */
        .lifecycle-flow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding-bottom: 2rem;
        }

        .lifecycle-step {
            background-color: var(--sec-lifecycle-bg);
            border: 1px solid var(--sec-lifecycle-border);
            color: var(--sec-lifecycle-text);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
            z-index: 1;
            flex: 1;
            margin: 0 0.25rem;
        }

        .arrow {
            color: var(--text-muted);
            font-size: 1.5rem;
            z-index: 1;
        }

        .feedback-loop {
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 1.5rem;
            border: 2px solid var(--text-muted);
            border-top: none;
            border-radius: 0 0 8px 8px;
        }

        .feedback-loop::before {
            content: '↑';
            position: absolute;
            left: -12px;
            top: -14px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .feedback-text {
            position: absolute;
            bottom: -0.5rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--bg-color);
            padding: 0 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* 2. System Stack Section */
        .stack-container {
            display: flex;
            gap: 1.5rem;
            align-items: stretch;
        }

        .stack-layers {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .stack-layer {
            background-color: var(--sec-stack-bg);
            border: 1px solid var(--sec-stack-border);
            color: var(--sec-stack-text);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stack-layer h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .stack-layer p { margin: 0.25rem 0 0 0; font-size: 0.9rem; opacity: 0.8; }

        .stack-side {
            flex: 1;
            background-color: var(--sec-stack-bg);
            border: 1px solid var(--sec-stack-border);
            color: var(--sec-stack-text);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
        }
        
        .stack-side h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .stack-side p { margin: 0.25rem 0 0 0; font-size: 0.9rem; opacity: 0.8; }

        /* 3. Cross-Cutting Concerns Section */
        .concerns-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .concern-box {
            background-color: var(--sec-concerns-bg);
            border: 1px solid var(--sec-concerns-border);
            color: var(--sec-concerns-text);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .concern-box h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .concern-box p { margin: 0.25rem 0 0 0; font-size: 0.9rem; opacity: 0.8; }

        /* 4. Organization Section */
        .org-section {
            background-color: var(--sec-org-bg);
            border: 2px dashed var(--sec-org-border);
            color: var(--sec-org-text);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
        }

        .org-section h3 { margin: 0; font-size: 1.2rem; font-weight: 600; }
        .org-section p { margin: 0.25rem 0 0 0; font-size: 1rem; opacity: 0.8; }

        /* Responsive */
        @media (max-width: 768px) {
            .lifecycle-flow {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            .arrow {
                transform: rotate(90deg);
                margin: 0 auto;
            }
            .feedback-loop { display: none; }
            .feedback-text { position: static; transform: none; margin-top: 1rem; display: block; }
            
            .stack-container { flex-direction: column; }
            .concerns-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .concerns-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="diagram-container">

    <!-- 1. Lifecycle -->
    <div class="section">
        <h2 class="section-title">Lifecycle: when work happens</h2>
        <div class="lifecycle-flow">
